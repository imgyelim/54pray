<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>54일 묵주기도</title>
<style>
:root{--bg:#f7f4ee;--paper:#fffefa;--ink:#382f2a;--muted:#8b8178;--line:#e9e2d8;--olive:#65705d;--wine:#9f5954;--shadow:0 14px 38px #49382412}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.wrap{max-width:980px;margin:auto;padding:34px 26px 65px}.hero{min-height:255px;border-radius:24px;background:linear-gradient(100deg,#343d35ed,#46463cce 48%,#5145379b),url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1800&q=85') center 48%/cover;color:#fff;padding:34px 44px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'✝';position:absolute;right:11%;top:13%;font:140px Georgia,serif;color:#ffffff13}.brand,.kicker{font-size:10px;letter-spacing:.19em;font-weight:700}.brand{color:#e4d6bd}.hero h1{font:500 clamp(34px,5vw,52px) Georgia,'Malgun Gothic',serif;letter-spacing:-.04em;margin:17px 0 9px}.hero p{margin:0;color:#eee9df;font-size:14px;line-height:1.8}.section{margin-top:28px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.kicker{color:var(--wine)}h2{font:500 23px Georgia,'Malgun Gothic',serif;margin:6px 0 0}.soft{font-size:11px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.today-record{min-height:125px}.record-empty{text-align:center;padding:30px;color:#9c9084;background:#fbf9f5;border:1px dashed var(--line);border-radius:16px}.record-empty span{display:block;color:#b49b7a;font-size:24px;margin-bottom:8px}.record{padding:20px 22px}.record-date{font-size:11px;color:var(--wine);font-weight:700;margin-bottom:14px}.record-cols{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.record-block+.record-block{border-top:1px solid #f0ebe4;margin-top:14px;padding-top:13px}.record h3{font:500 16px Georgia,'Malgun Gothic',serif;color:#76604e;margin:0 0 7px}.record h3.med{color:var(--olive)}.record-text{font-size:13px;line-height:1.85;color:#655b54;white-space:pre-wrap;overflow-wrap:anywhere}.record-img{width:100%;max-height:360px;object-fit:contain;background:#f2eee8;border-radius:11px;display:block}.date-input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:white;color:#71675f;font:12px inherit}.composer{padding:20px}.compose-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.compose-head strong{font-size:13px}.label{display:block;font-size:11px;color:#8b6c55;font-weight:700;margin:0 0 7px}.textarea{width:100%;min-height:100px;resize:vertical;border:1px solid #eee7de;border-radius:11px;background:#fffefa;padding:12px 13px;color:#594f48;font:13px/1.8 'Apple SD Gothic Neo','Malgun Gothic',sans-serif;outline:none}.textarea:focus{border-color:#cbb596}.textarea::placeholder{color:#b5aaa0}.form-block{margin-bottom:15px}.pastebox{min-height:132px;border:1px dashed #d8cfc3;border-radius:12px;background:#faf8f3;display:grid;place-items:center;overflow:hidden;cursor:pointer}.pastebox img{display:none;max-width:100%;max-height:330px;object-fit:contain}.pastebox.has img{display:block}.pastebox.has{padding:9px}.pastebox.has .pick{display:none}.pick{text-align:center;color:#92877c;padding:15px}.pick b{display:block;font-size:12px;color:#76695c}.pick small{display:block;font-size:10px;margin-top:6px}.img-actions{display:flex;gap:14px;margin-top:7px}.img-actions label,.clear{font-size:11px;color:#82766a;cursor:pointer}.clear{border:0;background:none}.file{display:none}.form-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.hint{font-size:10px;color:#a1978d}.publish{border:0;border-radius:10px;background:var(--olive);color:#fff;padding:11px 18px;font-size:12px;cursor:pointer}.history{margin-top:30px}.history-list{display:flex;flex-direction:column;gap:8px}.history-item{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}.history-btn{width:100%;padding:14px 16px;background:transparent;border:0;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;color:var(--ink)}.history-btn:hover,.history-item.open .history-btn{background:#f8f3eb}.history-date{font-size:13px;font-weight:600}.history-detail{font-size:11px;color:#a09283;margin-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}.chevron{color:#9a8876;font-size:16px;transition:transform .2s}.history-item.open .chevron{transform:rotate(180deg)}.history-content{display:none;border-top:1px solid #eee7dd}.history-item.open .history-content{display:block}.empty-history{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:#a09283;background:#fbf9f5;font-size:12px}.footnote{text-align:center;font:italic 13px Georgia,serif;color:#a29485;margin:32px 0 0}@media(max-width:650px){.wrap{padding:17px 13px 45px}.hero{min-height:220px;padding:26px 23px}.hero:after{font-size:100px;right:4%}.heading{align-items:flex-start;gap:8px;flex-direction:column}.record-cols{grid-template-columns:1fr}.record{padding:17px}.composer{padding:16px}.compose-head{gap:10px;align-items:flex-start;flex-direction:column}.history-detail{max-width:45%}}
/* Board-style archive list */
.history-list{display:block;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.history-list:before{content:'날짜                                      기록 미리보기';display:block;padding:11px 17px;background:#f3eee6;color:#8e8174;font-size:10px;letter-spacing:.08em;border-bottom:1px solid var(--line)}
.history-item{border:0;border-radius:0;border-bottom:1px solid #eee8df;background:transparent}
.history-item:last-child{border-bottom:0}
.history-btn{display:grid;grid-template-columns:170px minmax(0,1fr) 24px;gap:14px;padding:14px 17px}
.history-btn:hover,.history-item.open .history-btn{background:#faf7f1}
.history-date{font-size:12px;color:#665348}
.history-detail{font-size:12px;color:#928579;margin:0;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-content{background:#fffefa}
.history-list .empty-history{border:0;border-radius:0}
@media(max-width:650px){.history-list:before{content:'날짜                                      기록 미리보기';padding:10px 12px}.history-btn{grid-template-columns:112px minmax(0,1fr) 18px;gap:8px;padding:13px 12px}.history-date{font-size:11px}.history-detail{font-size:10px}}
.history-item{position:relative}
.history-btn{width:calc(100% - 58px);display:grid}
.delete-record{position:absolute;right:15px;top:14px;border:1px solid #e8ddd2;background:#fffefa;color:#a36c60;border-radius:7px;padding:5px 8px;font-size:10px;cursor:pointer}
.delete-record:hover{background:#f8eeea}
@media(max-width:650px){.history-btn{width:calc(100% - 53px)}.delete-record{right:10px;top:12px;padding:5px 6px}}
.admin-panel{padding:15px 18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.admin-fields{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.admin-fields input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12px}.admin-button{border:0;border-radius:8px;background:#88745f;color:#fff;padding:9px 13px;font-size:11px;cursor:pointer}.admin-status{font-size:11px;color:#8b8178}.composer[hidden]{display:none}.status-line{font-size:11px;color:#8b8178;margin:0 0 10px}.delete-record[hidden]{display:none}
@media(max-width:650px){.admin-panel{align-items:flex-start;flex-direction:column}.admin-fields{width:100%}.admin-fields input{min-width:0;flex:1}}
</style></head><body><main class="wrap">
<header class="hero"><div class="brand">A JOURNEY OF PRAYER</div><h1>54일 묵주기도</h1><p>하루의 말씀과 묵상을 정성껏 기록하는 공간</p></header>
<section class="section"><div class="heading"><div><div class="kicker">TODAY</div><h2>오늘의 기록</h2></div><span class="soft" id="todayLabel"></span></div><div id="todayRecord" class="today-record"></div></section>
<section class="section"><div class="heading"><div><div class="kicker">DAILY ENTRY</div><h2>기록 올리기</h2></div></div><div class="card admin-panel"><div class="admin-status" id="adminStatus">기록을 불러오는 중…</div><div class="admin-fields" id="loginFields"><input id="loginEmail" type="email" placeholder="관리자 이메일" autocomplete="username"><input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="admin-button" id="loginButton" type="button">관리자 로그인</button></div><div class="admin-fields" id="logoutFields" hidden><span id="signedInLabel" class="admin-status"></span><button class="admin-button" id="logoutButton" type="button">로그아웃</button></div></div><p class="status-line" id="connectionMessage"></p><div class="card composer" id="composer" hidden><div class="compose-head"><strong>매일미사와 묵상을 적어주세요</strong><input class="date-input" type="date" id="postDate"></div><div class="form-block"><label class="label" for="missal">매일미사</label><textarea class="textarea" id="missal" placeholder="오늘의 매일미사 내용을 적어주세요…"></textarea></div><div class="form-block"><span class="label">생활성서사 소금항아리 이미지</span><div class="pastebox" id="pasteBox" tabindex="0"><img id="imagePreview" alt="소금항아리 이미지"><span class="pick"><b>이미지를 여기에 붙여넣으세요</b><small>이미지 복사 후 이곳에서 Ctrl+V · 또는 파일 선택</small></span></div><div class="img-actions"><label for="imageFile">이미지 파일 선택</label><button class="clear" id="clearImage" type="button" hidden>이미지 지우기</button><input class="file" id="imageFile" type="file" accept="image/*"></div></div><div class="form-block"><label class="label" for="meditation">매일의 묵상</label><textarea class="textarea" id="meditation" placeholder="말씀을 읽고 마음에 남은 묵상을 적어주세요…"></textarea></div><div class="form-foot"><span class="hint">같은 날짜에 다시 올리면 그 날짜 기록을 수정합니다.</span><button class="publish" id="publish">기록 저장하기 ↗</button></div></div></section>
<section class="section history"><div class="heading"><div><div class="kicker">ARCHIVE</div><h2>이전 기록</h2></div><span class="soft" id="historyCount"></span></div><div class="history-list" id="historyList"></div></section><p class="footnote">“두려워하지 마라. 내가 너와 함께 있다.” · 이사야 41,10</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zxmbvhxyidiriekbsokh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_3GDPzzyZPOPuGmC3U8Mycg_-f1pB4kF';
const BUCKET='sogum-images';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let posts=[],session=null,pendingImage=null,existingImageUrl='',removeImage=false;
const $=id=>document.getElementById(id);const now=new Date();const localDate=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;$('postDate').value=localDate;$('todayLabel').textContent=niceDate(localDate);
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function niceDate(s){const d=new Date(s+'T12:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function recordHTML(p){return `<div class="record"><div class="record-date">${esc(niceDate(p.date))}</div><div class="record-cols"><div>${p.missal?`<div class="record-block"><h3>매일미사</h3><div class="record-text">${esc(p.missal)}</div></div>`:''}${p.meditation?`<div class="record-block"><h3 class="med">매일의 묵상</h3><div class="record-text">${esc(p.meditation)}</div></div>`:''}</div>${p.image?`<img class="record-img" src="${esc(p.image)}" alt="생활성서사 소금항아리 이미지">`:'<div></div>'}</div></div>`}
function showMessage(msg){$('connectionMessage').textContent=msg||''}
function render(){const sorted=[...posts].sort((a,b)=>b.date.localeCompare(a.date));const current=sorted.find(p=>p.date===localDate);$('todayRecord').innerHTML=current?`<div class="card">${recordHTML(current)}</div>`:'<div class="record-empty"><span>✝</span>오늘 기록을 작성하면 이곳에 가장 먼저 보여요.</div>';const prev=sorted.filter(p=>p.date!==localDate);$('historyCount').textContent=prev.length?`${prev.length}일`:'날짜별 기록';$('historyList').innerHTML=prev.length?prev.map(p=>`<div class="history-item"><button class="history-btn" type="button"><span class="history-date">${esc(niceDate(p.date))}</span><span class="history-detail">${esc(p.missal||p.meditation||'이미지 기록')}</span><span class="chevron">⌄</span></button>${session?`<button class="delete-record" type="button" data-date="${esc(p.date)}">삭제</button>`:''}<div class="history-content">${recordHTML(p)}</div></div>`).join(''):'<div class="empty-history">오늘 이전에 저장한 기록이 여기에 날짜별로 표시됩니다.</div>';document.querySelectorAll('.history-btn').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));document.querySelectorAll('.delete-record').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm('이 날짜의 기록을 삭제할까요?'))return;const {error}=await client.from('daily_entries').delete().eq('entry_date',b.dataset.date);if(error){showMessage('삭제하지 못했어요: '+error.message);return}showMessage('기록을 삭제했어요.');await loadEntries()})}
async function loadEntries(){const {data,error}=await client.from('daily_entries').select('entry_date,missal,meditation,image_url,updated_at').order('entry_date',{ascending:false});if(error){$('adminStatus').textContent='기록을 불러오지 못했어요.';showMessage('Supabase 연결 오류: '+error.message);return}posts=(data||[]).map(r=>({date:r.entry_date,missal:r.missal||'',meditation:r.meditation||'',image:r.image_url||''}));$('adminStatus').textContent='모든 방문자가 같은 기록을 볼 수 있어요.';render()}
function updateAuthUI(){const logged=!!session;$('loginFields').hidden=logged;$('logoutFields').hidden=!logged;$('composer').hidden=!logged;if(logged){$('signedInLabel').textContent=`관리자로 로그인됨 (${session.user.email})`;$('adminStatus').textContent='관리자 모드 · 기록을 작성하고 수정할 수 있어요.'}else{$('adminStatus').textContent='기록은 누구나 볼 수 있고, 작성은 관리자 로그인 후 가능합니다.';$('missal').value='';$('meditation').value='';clearPreview()}}
$('loginButton').onclick=async()=>{const email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password){showMessage('관리자 이메일과 비밀번호를 입력해 주세요.');return}$('loginButton').disabled=true;const {data,error}=await client.auth.signInWithPassword({email,password});$('loginButton').disabled=false;if(error){showMessage('로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.');return}session=data.session;updateAuthUI();showMessage('관리자로 로그인했어요.');await loadEntries()};$('logoutButton').onclick=async()=>{const {error}=await client.auth.signOut();if(error){showMessage(error.message);return}session=null;updateAuthUI();showMessage('로그아웃했어요.');render()};
function previewFile(file){pendingImage=file;existingImageUrl='';removeImage=false;$('imagePreview').src=URL.createObjectURL(file);$('pasteBox').classList.add('has');$('clearImage').hidden=false}function showExistingImage(url){pendingImage=null;existingImageUrl=url;removeImage=false;$('imagePreview').src=url;$('pasteBox').classList.add('has');$('clearImage').hidden=false}function clearPreview(){pendingImage=null;existingImageUrl='';removeImage=true;$('imagePreview').removeAttribute('src');$('pasteBox').classList.remove('has');$('clearImage').hidden=true;$('imageFile').value=''}$('pasteBox').onclick=()=>$('pasteBox').focus();document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item){const file=item.getAsFile();if(file)previewFile(file)}});$('imageFile').onchange=e=>{const file=e.target.files[0];if(file)previewFile(file)};$('clearImage').onclick=clearPreview;
$('postDate').onchange=()=>{const p=posts.find(x=>x.date===$('postDate').value);$('missal').value=p?.missal||'';$('meditation').value=p?.meditation||'';if(p?.image)showExistingImage(p.image);else clearPreview()};
$('publish').onclick=async()=>{const date=$('postDate').value,missal=$('missal').value.trim(),meditation=$('meditation').value.trim();if(!session){showMessage('먼저 관리자 로그인을 해주세요.');return}if(!date)return;if(!missal&&!meditation&&!pendingImage&&!existingImageUrl)return;let image_url=removeImage?'':existingImageUrl;if(pendingImage){const safeName=pendingImage.name?pendingImage.name.replace(/[^\w.-]/g,'_'):'pasted-image.png';const path=`${session.user.id}/${date}-${Date.now()}-${safeName}`;const {error:uploadError}=await client.storage.from(BUCKET).upload(path,pendingImage,{contentType:pendingImage.type||'image/png',upsert:false});if(uploadError){showMessage('이미지를 올리지 못했어요: '+uploadError.message+' (Storage 업로드 정책을 확인해 주세요.)');return}image_url=client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}const {error}=await client.from('daily_entries').upsert({entry_date:date,missal,meditation,image_url,updated_at:new Date().toISOString()},{onConflict:'entry_date'});if(error){showMessage('기록을 저장하지 못했어요: '+error.message);return}showMessage('기록을 저장했어요.');$('missal').value='';$('meditation').value='';clearPreview();await loadEntries()};
async function start(){const {data}=await client.auth.getSession();session=data.session;updateAuthUI();await loadEntries();client.auth.onAuthStateChange((_event,newSession)=>{session=newSession;updateAuthUI();loadEntries()})}start();
</script></body></html>
